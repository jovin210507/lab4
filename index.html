<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Capital</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14213d;
    color: #e5e5e5;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 1.5rem;
  }

  select {
    font-family: inherit;
    font-size: 1.1rem;
    padding: 0.7rem 1rem;
    color: #14213d;
    background: #fca311;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }

  select:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  /* Capital text styling: color, bold, font size */
  #capital {
    color: #7bdff2;
    font-weight: 700;
    font-size: 2.4rem;
    font-style: italic;
    min-width: 8ch;
  }
</style>
</head>
<body>

<div class="row">
  <select id="country" aria-label="Country">
    <option value="" selected disabled>Pick a country</option>
    <option value="Italy">Italy</option>
    <option value="Egypt">Egypt</option>
    <option value="Canada">Canada</option>
    <option value="Kenya">Kenya</option>
    <option value="Argentina">Argentina</option>
  </select>

  <span id="capital" aria-live="polite"></span>
</div>

<script>
  const capitals = {
    Italy: "Rome",
    Egypt: "Cairo",
    Canada: "Ottawa",
    Kenya: "Nairobi",
    Argentina: "Buenos Aires"
  };

  document.getElementById("country").addEventListener("change", function (e) {
    document.getElementById("capital").textContent = capitals[e.target.value];
  });
</script>

</body>
</html>
